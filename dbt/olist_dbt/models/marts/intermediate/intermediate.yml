version: 2

models:
  - name: int_orders_enriched
    description: Order-level intermediate model with one row per order_id combining order, payment, item, and delivery context.
    columns:
      - name: order_id
        description: Unique order identifier.
        tests:
          - not_null
          - unique

      - name: customer_id
        description: Customer associated with the order.
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id

      - name: order_status
        description: Status of the order from the source order registry.

      - name: gross_order_revenue
        description: Total item-level gross revenue for the order.

      - name: total_items
        description: Total number of item rows in the order.

      - name: total_payment_value
        description: Total payment amount recorded for the order.

      - name: payment_record_count
        description: Number of payment records associated with the order.

      - name: is_delivered
        description: Boolean flag indicating whether the order was delivered.

      - name: is_on_time
        description: Boolean flag indicating whether the order was delivered on time.

      - name: is_late
        description: Boolean flag indicating whether the order was delivered late.
      
      - name: avg_review_score
        description: Average review score for the order based on customer reviews.
      - name: review_count
        description: Number of reviews associated with the order.
  
  - name: int_customer_orders
    description: Customer order sequencing model based on delivered orders only.
    columns:
      - name: order_id
        description: Unique order identifier.
        tests:
          - not_null
          - unique

      - name: customer_id
        description: Customer associated with the order.
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id

      - name: order_date
        description: Delivered order purchase date.

      - name: order_month
        description: Month of the delivered order.

      - name: customer_order_number
        description: Sequential order number for the customer.

      - name: cohort_month
        description: Month of the customer's first delivered order.

      - name: months_since_first_order
        description: Number of months elapsed since first delivered order.
      - name: next_order_date
        description: Purchase date of the customer's next delivered order.
  
  - name: int_seller_orders
    description: Seller-order intermediate model with one row per seller_id and order_id.
    columns:
      - name: seller_id
        description: Seller participating in the order.
        tests:
          - not_null
          - relationships:
              to: ref('dim_sellers')
              field: seller_id

      - name: order_id
        description: Order identifier.
        tests:
          - not_null

      - name: order_month
        description: Month of order purchase.

      - name: seller_order_revenue
        description: Total gross revenue for the seller within the order.

      - name: seller_order_items
        description: Total item quantity sold by the seller within the order.

      - name: is_delivered
        description: Whether the order was delivered.

      - name: is_on_time
        description: Whether the order was delivered on time.

      - name: is_late
        description: Whether the order was delivered late.

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - seller_id
            - order_id

  - name: int_category_orders
    description: Category-order intermediate model with one row per product category and order_id.
    columns:
      - name: product_category_name_english
        description: English-translated product category.
        tests:
          - not_null

      - name: order_id
        description: Order identifier.
        tests:
          - not_null

      - name: order_month
        description: Month of order purchase.

      - name: category_order_revenue
        description: Total category-attributed revenue within the order.

      - name: category_order_items
        description: Total category-attributed item count within the order.

      - name: is_delivered
        description: Whether the order was delivered.

      - name: is_on_time
        description: Whether the order was delivered on time.

      - name: avg_review_score
        description: Average review score recorded at the order level.

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - product_category_name_english
            - order_id