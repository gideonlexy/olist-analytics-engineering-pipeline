version: 2

models:
  - name: mrt_revenue_daily
    description: Daily revenue mart for delivered orders, including order count and average order value.
    columns:
      - name: order_date
        description: Calendar date of order purchase.
        tests:
          - not_null
          - unique

      - name: delivered_orders
        description: Number of delivered orders placed on the day.
        tests:
          - not_null

      - name: daily_revenue
        description: Total realized gross revenue for delivered orders on the day.

      - name: average_order_value
        description: Average gross order revenue for delivered orders on the day.

      - name: total_items
        description: Total delivered item count for the day.

  - name: mrt_customer_cohorts_monthly
    description: Monthly customer cohort mart for retention and repeat purchase analysis.
    columns:
      - name: cohort_month
        description: Month of the customer's first delivered order.
        tests:
          - not_null

      - name: order_month
        description: Activity month of the customer's delivered order.
        tests:
          - not_null

      - name: months_since_first_order
        description: Number of months since the cohort month.
        tests:
          - not_null

      - name: cohort_size
        description: Number of customers in the cohort.

      - name: active_customers
        description: Number of active customers in the cohort-month.

      - name: new_customers
        description: Number of first-time customers in the month.

      - name: returning_customers
        description: Number of returning customers in the month.

      - name: retention_rate
        description: Share of the original cohort active in the month.

      - name: repeat_purchase_rate
        description: Share of active customers in the month who are repeat customers.

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - cohort_month
            - order_month

  - name: mrt_delivery_sla
    description: Monthly delivery SLA mart by customer state.
    columns:
      - name: delivery_month
        description: Month when the order was delivered.
        tests:
          - not_null

      - name: customer_state
        description: Customer state for the delivered order.
        tests:
          - not_null

      - name: delivered_orders
        description: Number of delivered orders in the month and state.
        tests:
          - not_null

      - name: on_time_orders
        description: Number of delivered orders that were on time.

      - name: late_orders
        description: Number of delivered orders delivered after the estimated date.

      - name: on_time_rate
        description: Share of delivered orders that were on time.

      - name: avg_delivery_duration_days
        description: Average days from purchase to delivery.

      - name: avg_delivery_delay_days
        description: Average days between estimated and actual delivery.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - delivery_month
            - customer_state

  - name: mrt_seller_scorecard
    description: Monthly seller performance mart combining revenue, volume, and delivery metrics.
    columns:
      - name: seller_id
        description: Seller identifier.
        tests:
          - not_null
          - relationships:
              to: ref('dim_sellers')
              field: seller_id

      - name: order_month
        description: Month of order purchase.
        tests:
          - not_null

      - name: total_orders
        description: Number of distinct orders involving the seller.

      - name: total_items_sold
        description: Total items sold by the seller.

      - name: total_revenue
        description: Total seller revenue for the month.

      - name: delivered_orders
        description: Number of delivered orders involving the seller.

      - name: on_time_orders
        description: Number of seller-involved orders delivered on time.

      - name: late_orders
        description: Number of seller-involved orders delivered late.

      - name: on_time_rate
        description: Share of delivered seller-involved orders delivered on time.

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - seller_id
            - order_month

  - name: mrt_category_performance
    description: Monthly category performance mart combining revenue, volume, delivery, and review metrics.
    columns:
      - name: product_category_name_english
        description: English-translated product category.
        tests:
          - not_null

      - name: order_month
        description: Month of order purchase.
        tests:
          - not_null

      - name: total_orders
        description: Number of distinct orders containing the category.

      - name: total_items_sold
        description: Total items sold for the category.

      - name: total_revenue
        description: Total category revenue.

      - name: delivered_orders
        description: Number of delivered orders containing the category.

      - name: on_time_orders
        description: Number of on-time delivered orders containing the category.

      - name: on_time_rate
        description: Share of delivered category orders that were on time.

      - name: avg_delivery_duration_days
        description: Average delivery duration for orders containing the category.

      - name: avg_delivery_delay_days
        description: Average delivery delay for orders containing the category.

      - name: avg_review_score
        description: Average order-level review score for orders containing the category.

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - product_category_name_english
            - order_month