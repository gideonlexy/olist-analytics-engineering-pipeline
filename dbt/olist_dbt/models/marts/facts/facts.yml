version: 2
models:
  - name: fct_order_items
    description: "Order item fact(1 row per order_id + product_id + seller_id)"
    columns:
      - name: order_id
        tests: 
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id

      - name: order_item_id
        tests: [not_null]
      - name: product_id
        tests: 
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id

      - name: seller_id
        tests: [not_null]
      
      - name: price
        tests: [not_null]

      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
              
  - name: fct_orders
    description: "Order grain fact(1 row per order_id)"
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id