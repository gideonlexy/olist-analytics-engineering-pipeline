version: 2
models:
  - name: fct_order_items
    description: "Order item fact(1 row per order_id + order_item_id)"
    columns:
      - name: order_id
        description: Order identifier.
        tests: 
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id

      - name: order_item_id
        description: Line number of the item within an order.
        tests: [not_null]

      - name: product_id
        description: Product purchased on the order line.
        tests: 
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id

      - name: seller_id
        description: Seller fulfilling the order item.
        tests: [not_null]
      
      - name: item_price
        description: The price of the item excluding freight cost.
        tests: [not_null]

      - name: customer_id
        description: The customer placing the order.
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: order_status
        description: The current status of the order.
      - name: freight_value
        description: The freight cost for the item.
      - name: gross_item_value
        description: The total value of the item including freight cost.
      - name: item_quantity
        description: The quantity of the item purchased (default to 1 as each row represents a single product line).  

  - name: fct_orders
    description: "Order grain fact(1 row per order_id)"
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id

  - name: fct_payments
    description: Payment fact table with one row per order_id and payment_sequential.
    columns:
      - name: order_id
        description: Order identifier.
        tests:
          - not_null

      - name: payment_sequential
        description: Sequence number of the payment record within an order.
        tests:
          - not_null

      - name: customer_id
        description: Customer placing the order.
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id

      - name: payment_type
        description: Payment method used for the transaction.

      - name: payment_installments
        description: Number of installments used for the payment.

      - name: payment_value
        description: Payment amount recorded for the payment event.

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - order_id
            - payment_sequential

  - name: fct_delivery
    description: Delivery fact table with one row per order_id for SLA and operational analysis.
    columns:
      - name: order_id
        description: Unique order identifier at delivery fact grain.
        tests:
          - not_null
          - unique

      - name: customer_id
        description: Customer associated with the order.
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id

      - name: order_status
        description: Current status of the order.

      - name: order_purchase_timestamp
        description: Timestamp when the order was placed.

      - name: order_delivered_customer_date
        description: Timestamp when the order was delivered to the customer.

      - name: order_estimated_delivery_date
        description: Estimated delivery date promised for the order.

      - name: delivery_duration_days
        description: Number of days between purchase date and customer delivery date.

      - name: delivery_delay_days
        description: Number of days between actual and estimated delivery date. Positive means late.

      - name: is_delivered
        description: Boolean flag indicating whether the order status is delivered.

      - name: is_on_time
        description: Boolean flag indicating whether delivery was on or before the estimated date.

      - name: is_late
        description: Boolean flag indicating whether delivery happened after the estimated date.