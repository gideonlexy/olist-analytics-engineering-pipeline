version: 2

models:
  - name: dim_customers
    description: "Customer dimension (1 row per customer_id)"
    columns:
     - name: customer_id
       tests: [not_null, unique]

  - name: dim_products
    description: "Product dimension (1 row per product_id)"

    columns:
      - name: product_id
        tests: [not_null, unique]

      - name: product_category_name
        description: Original product category name from source data.

      - name: product_category_name_english
        description: English-translated product category for reporting.

      - name: product_name_length
        description: Length of product name.

      - name: product_description_length
        description: Length of product description.

      - name: product_photos_qty
        description: Number of product photos.

      - name: product_weight_g
        description: Product weight in grams.

      - name: product_length_cm
        description: Product length in centimeters.

      - name: product_height_cm
        description: Product height in centimeters.

      - name: product_width_cm
        description: Product width in centimeters.
            
  
  - name: dim_sellers
    description: "Seller dimension (1 row per seller_id)"
    columns:
      - name: seller_id
        tests: [not_null, unique]
      - name: seller_zip_code_prefix
        description: Seller zip code prefix.

      - name: seller_city
        description: Seller city.

      - name: seller_state
        description: Seller state.

  - name: dim_date
    description: Calendar date dimension used for consistent time-based reporting across marts.
    columns:
      - name: date_day
        description: One row per calendar date.
        tests: [not_null, unique]
      - name: date_year
        description: Calendar year.
      - name: quarter
        description: Quarter of the year (1-4).
      - name: month
        description: Month component of the date (1-12).
      - name: month_name
        description: Full month name (e.g., January, February).
      - name: year_month
        description: Concatenated year and month in YYYY-MM format for easy grouping.
      - name: week_of_year
        description: Week number of the year (1-53).
      - name: iso_day_of_week
        description: ISO day of the week (1=Monday, 7=Sunday).
      - name: day_name
        description: Full day name (e.g., Monday, Tuesday).
      - name: is_weekend
        description: Boolean flag indicating if the date falls on a weekend.
      - name: month_start_date
        description: Start date of the calendar month.
      - name: quarter_start_date
        description: Start date of the calendar quarter.
      - name: year_start_date
        description: Start date of the calendar year.
      - name: week_start_date
        description: Start date of the calendar week (Monday).
