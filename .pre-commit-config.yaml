repos:
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.1.1
    hooks:
      - id: sqlfluff-fix
        additional_dependencies:
          - sqlfluff-templater-dbt
          - dbt-core
          - dbt-postgres
        args:
          - --config=.sqlfluff
      - id: sqlfluff-lint
        additional_dependencies:
          - sqlfluff-templater-dbt
          - dbt-core
          - dbt-postgres
        args:
          - --config=.sqlfluff
